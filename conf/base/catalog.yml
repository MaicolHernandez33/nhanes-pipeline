# =====================================================================
# FUENTE 1: Archivo Local (Datos Demográficos)
# =====================================================================
demographics_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/demographics.csv
  load_args:
    sep: ","
    encoding: "utf-8"

# =====================================================================
# FUENTE 2: Base de Datos SQL (Datos de Examen Físico / Medidas)
# =====================================================================
body_measures_sql:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: body_measures
  load_args:
    index_col: SEQN

# =====================================================================
# FUENTE 3: API REST (Simulación de Datos de Laboratorio)
# =====================================================================
laboratory_api:
  type: pandas.JSONDataset
  filepath: data/01_raw/laboratory.json


# =====================================================================
# DATASET INTERMEDIO: Datos Unificados de NHANES (Optimizado con Parquet)
# =====================================================================
nhanes_merged_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/nhanes_merged.parquet

  
