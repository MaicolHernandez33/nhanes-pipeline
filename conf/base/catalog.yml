# =====================================================================
# FUENTE 1: Archivo Local (Datos Demográficos)
# =====================================================================
demographics_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/demographics.csv
  load_args:
    sep: ","
    encoding: "utf-8"

# =====================================================================
# FUENTE 2: Base de Datos SQL (Datos de Examen Físico / Medidas)
# =====================================================================
body_measures_sql:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: body_measures
  load_args:
    index_col: SEQN

# =====================================================================
# FUENTE 3: API REST (Simulación de Datos de Laboratorio)
# =====================================================================
laboratory_api:
  type: pandas.JSONDataset
  filepath: data/01_raw/laboratory.json

# =====================================================================
# DATASETS INTERMEDIOS: Datos Unificados y Limpios
# =====================================================================
nhanes_merged_data:
  type: pandas.ParquetDataset
  filepath: data/02_intermediate/nhanes_merged.parquet


# =====================================================================
# DATASET PRIMARIO: Output listo para Machine Learning
# =====================================================================
df_nhanes_ml_listo:
  type: pandas.CSVDataset
  filepath: data/03_primary/df_nhanes_ml_listo.csv

# --- DATOS DE ENTRADA ---
df_nhanes_limpio:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/df_nhanes_limpio.csv

# --- MODELO DE SALIDA ---
modelo_hipertension:
  type: pickle.PickleDataset
  filepath: data/06_models/modelo_hipertension_web.pkl
  backend: joblib


# =====================================================================
# TAREA: PERSISTENCIA EN BASE DE DATOS (REQUISITO DOCKER/POSTGRES)
# =====================================================================
model_predictions:
  type: pandas.SQLTableDataset
  credentials: db_credentials
  table_name: model_predictions
  save_args:
    if_exists: replace
    index: false

model_save_summary:
  type: MemoryDataset